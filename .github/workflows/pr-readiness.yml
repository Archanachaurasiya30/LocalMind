name: PR readiness

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-readiness.yml'
      - '.github/pull_request_template.md'
      - 'scripts/contributing/**'

permissions:
  contents: read

concurrency:
  group: pr-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Contributor declarations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test the declaration checker
        run: node --test scripts/contributing/*.test.mjs
      - name: Check the PR description
        if: github.event_name == 'pull_request'
        run: node scripts/contributing/pr_readiness.mjs
