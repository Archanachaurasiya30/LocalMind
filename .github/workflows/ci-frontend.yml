name: CI – Frontend

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-lint-test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.0.9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: ESLint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Vitest
        working-directory: apps/desktop
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=../../artifacts/test-results/frontend.xml

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: artifacts/test-results/frontend.xml
          retention-days: 14

      - name: Production build
        working-directory: apps/desktop
        run: pnpm build
