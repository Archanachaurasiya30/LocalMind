[package]
name = "localmind-core"
version = "0.1.0"
edition = "2021"
description = "Window management, sidecar lifecycle, secrets, permissions, and audit log for LocalMind"

[dependencies]
dirs = "5"
rand = "0.8"
tokio = { version = "1", features = ["time", "process"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
